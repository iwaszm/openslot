<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>查询预约 · Berlin Barber</title>
    <link rel="stylesheet" href="../styles.css?v=20260902-admin-compact-tags" />
  </head>
  <body>
    <main class="lookup-page">
      <header class="admin-topbar page-header">
        <div>
          <p class="eyebrow" data-i18n="booking.eyebrow">Booking</p>
          <h1 data-i18n="lookup.title">查询预约</h1>
          <p class="section-copy" data-i18n="lookup.subtitle">用预约编号和邮箱查看或取消预约。</p>
        </div>
        <span class="topbar-actions">
          <a class="ghost-link" href="./index.html" data-i18n="nav.backCustomer">返回预约页</a>
          <label class="language-switch">
            <span class="sr-only" data-i18n="language.label">语言</span>
            <select class="language-select" aria-label="Language">
              <option value="zh">中文</option>
              <option value="en">EN</option>
              <option value="de">DE</option>
            </select>
          </label>
        </span>
      </header>

      <section class="lookup-grid">
        <form id="lookupForm" class="control-card">
          <div class="control-title">
            <strong data-i18n="lookup.credential">预约凭证</strong>
            <small id="storageStatus">正在检测数据源</small>
          </div>
          <label>
            <span data-i18n="lookup.code">Booking code</span>
            <input id="bookingIdInput" type="text" required data-i18n-placeholder="lookup.codePlaceholder" placeholder="预约成功后显示的编号" />
          </label>
          <label>
            <span data-i18n="lookup.email">邮箱</span>
            <input id="bookingEmailInput" type="email" required data-i18n-placeholder="lookup.emailPlaceholder" placeholder="预约时填写的邮箱" />
          </label>
          <button class="primary-action compact-action" type="submit" data-i18n="lookup.submit">查询预约</button>
          <p id="lookupMessage" class="form-message compact-message" role="status" aria-live="polite"></p>
        </form>

        <section id="bookingDetail" class="control-card booking-detail" hidden></section>
      </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../config.js?v=20260831-booking"></script>
    <script src="../i18n.js?v=20260902-admin-compact-tags"></script>
    <script src="./booking.js?v=20260903-confirm-prompts"></script>
  </body>
</html>
