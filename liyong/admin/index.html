<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#202020" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>Terminverwaltung</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./icon-192.png" />
    <link rel="stylesheet" href="../../styles.css?v=20260913-availability-blocks-1" />
    <link rel="stylesheet" href="./pwa.css" />
  </head>
  <body>
    <main class="admin-page">
      <p id="adminOfflineNotice" class="admin-offline-notice" role="status" aria-live="polite" hidden>Keine Internetverbindung. Änderungen sind vorübergehend nicht möglich.</p>
      <header class="admin-topbar page-header">
        <div>
          <h1 data-i18n="admin.title">Terminverwaltung</h1>
        </div>
        <span class="topbar-actions">
          <a class="ghost-link" href="../index.html" data-i18n="nav.backCustomer">返回顾客页</a>
          <form id="ownerLoginForm" class="owner-login topbar-login">
            <input id="ownerEmail" type="email" autocomplete="email" data-i18n-placeholder="admin.emailPlaceholder" placeholder="owner@example.com" required />
            <input id="ownerPassword" type="password" autocomplete="current-password" data-i18n-placeholder="admin.passwordPlaceholder" placeholder="Passwort" required />
            <button class="primary-action compact-action" type="submit" data-i18n="admin.login">店主登录</button>
            <div id="ownerTurnstile" class="cf-turnstile admin-turnstile" data-sitekey="0x4AAAAAAEsrM-tkdjA40QZH" data-theme="light" data-language="de" data-appearance="interaction-only"></div>
            <p id="ownerAuthMessage" class="form-message compact-message" role="status" aria-live="polite"></p>
          </form>
          <div id="ownerSession" class="owner-session topbar-session" hidden>
            <strong id="ownerEmailLabel"></strong>
            <button id="ownerLogoutButton" class="ghost-button" type="button" data-i18n="admin.logout">退出</button>
          </div>
        </span>
      </header>

      <section class="admin-grid admin-grid-single">
        <section id="ownerControls" class="admin-workspace" hidden>
          <div class="push-controls">
            <button id="pushToggleButton" class="ghost-button push-toggle-button" type="button" disabled>Benachrichtigungen aktivieren</button>
            <span id="pushStatus" class="push-status" role="status" aria-live="polite"></span>
          </div>
          <section class="control-card admin-toolbar-card">
            <div class="date-strip-shell admin-date-shell">
              <button id="adminDatePrevButton" class="date-nav-button" type="button" aria-label="Previous dates">‹</button>
              <div id="adminDateStrip" class="date-strip admin-date-strip" aria-label="Buchbare Daten"></div>
              <button id="adminDateNextButton" class="date-nav-button" type="button" aria-label="Next dates">›</button>
            </div>
            <input id="adminDateInput" class="native-date-input" type="date" required />
          </section>

          <section class="control-card appointment-admin-card">
            <div class="control-title">
              <strong id="appointmentCardTitle" data-i18n="admin.today">当日预约</strong>
            </div>
            <div id="appointmentList" class="appointment-list"></div>
            <div class="schedule-block-controls" aria-label="Verfügbarkeit verwalten">
              <button id="dayBlockButton" class="availability-action day-block-button" type="button"></button>
              <div class="time-block-control">
                <button id="timeBlockToggle" class="availability-action" type="button" aria-controls="timeBlockPanel" aria-expanded="false">
                  <svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
                  <span>Uhrzeit blockieren</span>
                  <svg class="disclosure-icon" aria-hidden="true" viewBox="0 0 24 24"><path d="m8 10 4 4 4-4"/></svg>
                </button>
                <div id="timeBlockPanel" class="time-block-panel" hidden>
                  <label><span>Von</span><select id="timeBlockStart"></select></label>
                  <label><span>Bis</span><select id="timeBlockEnd"></select></label>
                  <button id="timeBlockAction" class="time-block-submit" type="button">Uhrzeit blockieren</button>
                  <small id="timeBlockHint" aria-live="polite"></small>
                </div>
              </div>
            </div>
          </section>

          <section class="control-card appointment-log-card">
            <div class="control-title">
              <strong id="upcomingLogTitle" data-i18n="admin.upcomingLog">预约记录</strong>
              <button id="logCollapseButton" class="ghost-button collapse-button" type="button" aria-controls="upcomingLogList" aria-expanded="true">⌃</button>
            </div>
            <div id="upcomingLogList" class="appointment-log-list"></div>
          </section>
        </section>
      </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../../config.js?v=20260829-split-pages"></script>
    <script src="../../i18n.js?v=20260914-all-online-log-1"></script>
    <script src="../../confirm-dialog.js?v=20260913-notice-dialog-1"></script>
    <script src="./pwa.js"></script>
    <script src="../../admin.js?v=20260917-liyong-push-1"></script>
    <script src="./push.js"></script>
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
  </body>
</html>
