<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Terminverwaltung</title>
    <link rel="stylesheet" href="./styles.css?v=20260911-admin-timeline-4" />
  </head>
  <body>
    <main class="admin-page">
      <header class="admin-topbar page-header">
        <div>
          <h1 data-i18n="admin.title">Terminverwaltung</h1>
        </div>
        <span class="topbar-actions">
          <a class="ghost-link" href="./index.html" data-i18n="nav.backCustomer">返回顾客页</a>
          <form id="ownerLoginForm" class="owner-login topbar-login">
            <input id="ownerEmail" type="email" autocomplete="email" data-i18n-placeholder="admin.emailPlaceholder" placeholder="owner@example.com" required />
            <input id="ownerPassword" type="password" autocomplete="current-password" data-i18n-placeholder="admin.passwordPlaceholder" placeholder="Passwort" required />
            <button class="primary-action compact-action" type="submit" data-i18n="admin.login">店主登录</button>
            <div id="ownerTurnstile" class="cf-turnstile admin-turnstile" data-sitekey="0x4AAAAAAEsrM-tkdjA40QZH" data-theme="light" data-language="de" data-appearance="interaction-only"></div>
            <p id="ownerAuthMessage" class="form-message compact-message" role="status" aria-live="polite"></p>
          </form>
          <div id="ownerSession" class="owner-session topbar-session" hidden>
            <strong id="ownerEmailLabel"></strong>
            <button id="ownerLogoutButton" class="ghost-button" type="button" data-i18n="admin.logout">退出</button>
          </div>
        </span>
      </header>

      <section class="admin-grid admin-grid-single">
        <section id="ownerControls" class="admin-workspace" hidden>
          <section class="control-card admin-toolbar-card">
            <div class="control-title admin-toolbar-title">
              <strong data-i18n="admin.appointments">预约管理</strong>
            </div>
            <div class="date-strip-shell admin-date-shell">
              <button id="adminDatePrevButton" class="date-nav-button" type="button" aria-label="Previous dates">‹</button>
              <div id="adminDateStrip" class="date-strip admin-date-strip" aria-label="Buchbare Daten"></div>
              <button id="adminDateNextButton" class="date-nav-button" type="button" aria-label="Next dates">›</button>
            </div>
            <input id="adminDateInput" class="native-date-input" type="date" required />
          </section>

          <section class="control-card appointment-admin-card">
            <div class="control-title">
              <strong id="appointmentCardTitle" data-i18n="admin.today">当日预约</strong>
              <div class="appointment-title-actions">
                <button id="dayBlockButton" class="ghost-button day-block-button" type="button"></button>
                <button id="slotLayoutButton" class="ghost-button slot-layout-button" type="button" aria-label="Ein Slot pro Zeile" aria-pressed="true" title="Ein Slot pro Zeile"><span aria-hidden="true">▦</span></button>
              </div>
            </div>
            <div id="appointmentList" class="appointment-list"></div>
          </section>

          <section class="control-card appointment-log-card">
            <div class="control-title">
              <strong id="upcomingLogTitle" data-i18n="admin.upcomingLog">预约记录</strong>
              <button id="logCollapseButton" class="ghost-button collapse-button" type="button" aria-controls="upcomingLogList" aria-expanded="true">⌃</button>
            </div>
            <div id="upcomingLogList" class="appointment-log-list"></div>
          </section>
        </section>
      </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="./config.js?v=20260829-split-pages"></script>
    <script src="./i18n.js?v=20260910-admin-calendar-load-2"></script>
    <script src="./confirm-dialog.js?v=20260911-confirm-dialog-1"></script>
    <script src="./admin.js?v=20260911-admin-timeline-4"></script>
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
  </body>
</html>
